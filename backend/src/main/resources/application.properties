spring.application.name=hr-system

spring.datasource.url=jdbc:mysql://localhost:3306/hr_system
spring.datasource.username=hr_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
payslip.upload-dir=uploads/payslips/
announcement.upload-dir=uploads/announcements/

employee-document.upload-dir=uploads/employee-documents/
application.upload-dir=uploads/applications/
application.document-upload-dir=uploads/application-documents/